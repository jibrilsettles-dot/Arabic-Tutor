<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Muʿallim</title>
    <style>
      :root { --bg: #f6f1e6; --ink: #15211d; --muted: #5d6a64; --primary: #0e5b4b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b1412; --ink: #ece6d8; --muted: #93a39c; --primary: #2f9d80; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.25rem; margin: 20px 0 6px; }
      .ar { font-family: "Amiri", "Geeza Pro", serif; font-size: 1.6rem; margin: 0; }
      p { color: var(--muted); margin: 6px 0 0; }
      button { margin-top: 24px; background: var(--primary); color: #fff; border: 0; border-radius: 999px;
        padding: 12px 24px; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <p class="ar" lang="ar" dir="rtl">لَا يُوجَدُ اتِّصَالٌ</p>
      <h1>You're offline</h1>
      <p>Your tutor needs an internet connection. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
